const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY="reefsirtox_key";
async function deriveKey(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function decryptApp(key){
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
  return new TextDecoder().decode(buf);
}
function launch(html){document.open();document.write(html);document.close()}
(async()=>{
  const box=document.getElementById("box");
  if(!(window.crypto&&crypto.subtle)){box.hidden=false;document.getElementById("msg").textContent="Questo browser non supporta l'accesso protetto. Apri il sito con https.";return}
  try{
    const st=JSON.parse(localStorage.getItem(KEY)||"null");
    if(st&&st.s===D.salt){
      const key=await crypto.subtle.importKey("raw",b64(st.k),"AES-GCM",false,["decrypt"]);
      launch(await decryptApp(key));return;
    }
  }catch(e){try{localStorage.removeItem(KEY)}catch(x){}}
  box.hidden=false;document.getElementById("pw").focus();
  let tries=0;
  document.getElementById("f").onsubmit=async e=>{
    e.preventDefault();const pw=document.getElementById("pw").value,msg=document.getElementById("msg"),btn=document.getElementById("go");
    if(!pw)return;btn.disabled=true;msg.textContent="Verifico…";
    try{
      const key=await deriveKey(pw),html=await decryptApp(key);
      if(document.getElementById("rem").checked){const raw=await crypto.subtle.exportKey("raw",key);localStorage.setItem(KEY,JSON.stringify({s:D.salt,k:btoa(String.fromCharCode(...new Uint8Array(raw)))}))}
      launch(html);
    }catch(err){
      tries++;msg.textContent="Password errata.";document.getElementById("pw").value="";
      await new Promise(r=>setTimeout(r,Math.min(8000,tries*800)));btn.disabled=false;document.getElementById("pw").focus();
    }
  };
})();
})();
